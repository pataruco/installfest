# tmux configuration
# Install to ~/.config/tmux/tmux.conf
# Reload from inside tmux with: tmux source ~/.config/tmux/tmux.conf
#
# Purpose: provide a status bar (CPU / memory / network meters)
# when running Ghostty, which has no built-in status bar.

# ---- Plugins (managed by TPM, https://github.com/tmux-plugins/tpm) ----
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'          # sane defaults
set -g @plugin 'tmux-plugins/tmux-cpu'               # #{cpu_percentage}, #{ram_percentage}
set -g @plugin 'xamut/tmux-network-bandwidth'        # #{network_bandwidth}; works on macOS
                                                     # (tmux-plugins/tmux-net-speed is Linux-only)
set -g @plugin 'tmux-plugins/tmux-resurrect'         # persist tmux sessions across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'         # continuous saving & auto-restore
set -g @plugin 'tmux-plugins/tmux-yank'              # copy to macOS clipboard with mouse & y

# Session persistence (tmux-continuum)
set -g @continuum-restore 'on'

# ---- Status line ----
set -g status-position top
set -g status-interval 2
set -g status-right-length 80
set -g status-right '#[fg=#e06c75] CPU #{cpu_percentage} #[fg=#98c379] MEM #{ram_percentage} #[fg=#61afef] #{network_bandwidth} '

# Colours match the One Dark terminal theme used elsewhere in this installfest
set -g status-style 'bg=#21252b,fg=#abb2bf'

# ---- Quality of life ----
# Start window and pane numbering at 1 instead of 0 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
# Renumber windows automatically when one is closed
set -g renumber-windows on

# Scroll wheel and mouse selection behave like a plain terminal
set -g mouse on
# Let the terminal keep 24-bit colour and Ghostty's terminfo
set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',xterm-ghostty:RGB'
# Let programs talk to the outer terminal (OSC sequences, notifications).
# Off by default since tmux 3.3.
set -g allow-passthrough on
# Ctrl+L clears the pane AND its scrollback.
# The Ghostty config maps Cmd+K to Ctrl+L so it lands here.
bind -n C-l send-keys C-l \; clear-history
# Alt+O copies the output of the last command to the clipboard.
# The Ghostty config maps Cmd+Shift+A here.
# tmux 3.8 learns where output starts from the OSC 133 marks fish emits
# (`previous-prompt -o`). The end is anchored first by stepping up from the
# live prompt: `cursor-up` twice because the Starship prompt is 2 lines tall.
bind -n M-o copy-mode \; send-keys -X cursor-up \; send-keys -X cursor-up \; send-keys -X end-of-line \; send-keys -X begin-selection \; send-keys -X previous-prompt -o \; send-keys -X copy-pipe-and-cancel pbcopy

# ---- Initialise TPM (must stay the last line) ----
# TPM installs plugins next to this file, in ~/.config/tmux/plugins/
run '~/.config/tmux/plugins/tpm/tpm'
